[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plataforma-github-admin"
version = "0.1.0"
description = "Auditoria e configuração declarativa do GitHub da Plataforma Digital"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plataforma-github = "github_admin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
